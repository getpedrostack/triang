<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Triângulo OCR — da montagem da mesa à decisão de torra. Teste triangular cego (ISO 4120), ficha descritiva cega e escolha pelo objetivo. Original Coffee Roaster.">
<meta name="theme-color" content="#0f1412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triângulo OCR">
<meta name="application-name" content="Triângulo OCR">
<meta name="ocr-build" content="v2.4">
<link rel="manifest" id="manifestLink">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161d1a'/%3E%3Cpath d='M32 15 L49 46 L15 46 Z' fill='none' stroke='%2334c38f' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="appleIcon" href="">
<title>Triângulo OCR · Original Coffee Roaster</title>
<style>
:root{
  --bg:#0f1412; --surface:#161d1a; --surface-2:#1d2622; --surface-3:#25302b; --line:#2e3a34; --line-2:#3c4a43;
  --ink:#eef2ef; --ink-2:#c6cfca; --muted:#9aa7a0; --faint:#8d9a93;
  --em:#34c38f; --em-strong:#5ad6a6; --em-ink:#03130c; --em-soft:rgba(52,195,143,.14); --em-line:#1f6e52;
  --a:#d8c39f; --a-soft:rgba(216,195,159,.13); --b:#d68a5c; --b-soft:rgba(214,138,92,.14);
  --warn:#e3a95a; --warn-soft:rgba(227,169,90,.12); --warn-line:#6b5230;
  --danger:#ec7a66; --danger-soft:rgba(236,122,102,.12);
  --font:"Avenir Next","Segoe UI","Helvetica Neue",Roboto,"Noto Sans",Ubuntu,Arial,sans-serif;
  --r:14px; --r-sm:10px; --tap:52px;
  --pad:clamp(16px,3.4vw,28px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100vh}
a{color:var(--em-strong)}
:focus-visible{outline:3px solid var(--em-strong);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.wrap{max-width:780px;margin:0 auto;padding:0 var(--pad) calc(48px + env(safe-area-inset-bottom))}
.hide{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* barra superior */
#topbar{position:sticky;top:0;z-index:20;background:rgba(15,20,18,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb{max-width:780px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) var(--pad) 10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;color:var(--ink);background:none;border:0;padding:0;min-height:52px;font:inherit;cursor:pointer}
.brand svg{width:30px;height:30px;flex:0 0 auto}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.1}
.tb-sp{flex:1}
.tbtn{min-height:52px;min-width:52px;padding:0 14px;border-radius:22px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font:inherit;font-size:14px;cursor:pointer}
.tbtn:hover{border-color:var(--em-line);color:var(--ink)}
.stages{max-width:780px;margin:0 auto;padding:0 var(--pad) 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none}
.stages li{font-size:13px;color:var(--faint);padding:6px 0 0;border-top:3px solid var(--line);font-weight:550}
.stages li.on{color:var(--ink);border-top-color:var(--em)}
.stages li.done{color:var(--muted);border-top-color:var(--em-line)}

/* tipografia */
h1{font-size:clamp(28px,5vw,40px);line-height:1.08;letter-spacing:-.025em;margin:28px 0 8px;font-weight:700}
h2{font-size:24px;line-height:1.2;letter-spacing:-.015em;margin:0 0 6px;font-weight:680}
h3{font-size:18px;margin:22px 0 8px;font-weight:650;letter-spacing:-.01em}
p{margin:0 0 12px}
.lead{color:var(--ink-2);font-size:17px;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px;color:var(--muted)}

/* blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin:18px 0}
.card.tight{padding:16px}
.panel{border-left:3px solid var(--line-2);padding:4px 0 4px 14px;margin:12px 0}
.note{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;color:var(--ink-2);font-size:15px;margin:12px 0}
.note.warn{background:var(--warn-soft);border:1px solid var(--warn-line);color:#f3d6aa}
.note.danger{background:var(--danger-soft);color:#f6c0b5}
.demo-flag{background:var(--warn);color:#241604;font-weight:750;letter-spacing:.02em;border-radius:8px;padding:8px 12px;margin:16px 0;text-align:center}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);min-width:52px;padding:0 20px;border-radius:12px;
  font:inherit;font-weight:620;font-size:16px;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:background .15s,border-color .15s}
.btn.primary{background:var(--em);color:var(--em-ink)}
.btn.primary:hover{background:var(--em-strong)}
.btn.primary:disabled{background:var(--surface-3);color:var(--faint);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--em-line);background:var(--em-soft)}
.btn.quiet{background:transparent;color:var(--ink-2);border:0;text-decoration:underline;text-underline-offset:3px;padding:0 8px}
.btn.danger{background:var(--danger);color:#200803}
.btn.block{display:flex;width:100%}
.btn.big{min-height:60px;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .btn{flex:1 1 auto}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.actions-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sess-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding-top:14px;border-top:1px dashed var(--line-2)}
.sess-actions .btn{min-height:52px;font-size:14px;padding:0 14px;font-weight:560}
details.sess-more{margin-top:22px}
details.sess-more > summary{font-size:15px;color:var(--ink-2);font-weight:560}
details.sess-more .sess-actions{margin-top:0;padding-top:0;border-top:0}
.seg.inv-motivos{flex-direction:column}
.seg.inv-motivos button{flex:0 0 auto;text-align:left;padding:10px 14px}

/* home */
.home-cta{display:grid;grid-template-columns:1fr;gap:12px;margin:22px 0}
.home-cta .btn{min-height:72px;font-size:19px;justify-content:flex-start;padding:0 22px}
.home-cta .btn .t{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-size:20px;font-weight:680;line-height:1.2}
.home-cta .btn .t > span{display:block;font-size:14px;font-weight:500;opacity:.82;margin-top:2px}
.open-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.open-item{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.open-item .btn{min-height:52px}
.secondary-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* formulários */
label.f{display:block;font-size:14px;color:var(--ink-2);font-weight:600;margin:16px 0 6px}
input[type=text],input[type=number],textarea,select{width:100%;min-height:var(--tap);background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);
  border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--em);box-shadow:0 0 0 3px var(--em-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 140px;min-height:var(--tap);border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);font:inherit;font-size:15px;cursor:pointer;padding:6px 10px;text-align:center}
.seg button[aria-pressed=true]{border-color:var(--em);background:var(--em-soft);color:var(--ink);font-weight:620}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);border-radius:22px;padding:0 4px 0 14px;min-height:52px;font-size:15px}
.chip button{min-width:52px;min-height:52px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;border-radius:22px}
.addrow{display:flex;gap:8px}
.addrow.wraprow{flex-wrap:wrap}.addrow.wraprow input[type=text]{flex:1 1 100%}.addrow.wraprow select{flex:1 1 140px;max-width:none!important}
.addrow input{flex:1}
.stepper{display:flex;align-items:center;gap:8px}
.stepper input{width:96px;text-align:center;font-size:20px;font-weight:650}
.stepper button{min-width:52px;min-height:52px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font-size:24px;cursor:pointer}
.bench{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.bench label{display:flex;gap:12px;align-items:center;min-height:52px;font-size:15px;color:var(--ink-2);cursor:pointer}
.bench input{width:22px;height:22px;accent-color:var(--em);flex:0 0 auto}
.err{color:#ffb4a5;background:var(--danger-soft);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:15px}
details.x{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:var(--surface)}
details.x > summary{min-height:52px;display:flex;align-items:center;padding:0 16px;cursor:pointer;font-weight:620;list-style:none;color:var(--ink)}
details.x > summary::-webkit-details-marker{display:none}
details.x > summary::before{content:"+";display:inline-block;width:22px;color:var(--em-strong);font-weight:700}
details.x[open] > summary::before{content:"−"}
details.x > .in{padding:0 16px 16px}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* rodada · mapa */
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.who div{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.who b{display:block;font-size:20px}
.who span{font-size:13px;color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.map.two{grid-template-columns:repeat(2,1fr)}
.mapcell{border-radius:14px;padding:16px 12px;text-align:center;border:2px solid var(--line-2)}
.mapcell .pos{font-size:14px;color:var(--muted)}
.mapcell .n{font-size:44px;font-weight:750;line-height:1.05}
.mapcell .code{font-size:18px;font-weight:700;margin-top:6px;word-break:break-word}
.mapcell .role{font-size:13px;color:var(--muted)}
.mapcell.A{background:var(--a-soft);border-color:var(--a)} .mapcell.A .code{color:var(--a)}
.mapcell.B{background:var(--b-soft);border-color:var(--b)} .mapcell.B .code{color:var(--b)}
.private{display:flex;gap:10px;align-items:center;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px;padding:10px 14px;color:#f3d6aa;font-weight:600}

/* entrega */
.handoff{text-align:center;padding:48px 20px}
.handoff .glyph{width:84px;height:84px;margin:0 auto 18px}
.handoff h2{font-size:30px}

/* prova: as xícaras vistas de cima */
.progress{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:15px;margin:18px 0 4px}
.progress b{color:var(--ink);font-size:17px}
.qhead{font-size:clamp(28px,4.6vw,38px);font-weight:720;letter-spacing:-.02em;margin:8px 0 4px;text-align:center}
.cups{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,3vw,28px);margin:28px 0 22px}
.cup{appearance:none;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:10px;font:inherit}
.cup .disc{width:100%;max-width:220px;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 50%, #241b14 0 44%, #2d241c 45% 52%, var(--surface-3) 53% 100%);
  border:3px solid var(--line-2);font-size:clamp(46px,8vw,76px);font-weight:760;color:var(--ink);transition:border-color .15s,box-shadow .15s,transform .1s}
.cup .lbl{font-size:15px;color:var(--muted)}
.cup:hover .disc{border-color:var(--em-line)}
.cup[aria-checked=true] .disc{border-color:var(--em);box-shadow:0 0 0 6px var(--em-soft)}
.cup[aria-checked=true] .lbl{color:var(--em-strong);font-weight:650}
.cup:active .disc{transform:scale(.98)}
.ack{text-align:center;padding:40px 16px}
.ack .ring{width:72px;height:72px;border-radius:50%;border:3px solid var(--em-line);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--em-strong);font-size:30px}

/* relógio de cupping (desde a água) */
.clock{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;background:var(--surface-2);border:2px solid var(--line-2);border-radius:12px;padding:10px 14px;margin:14px 0;text-align:left}
.clock-t{font-size:32px;font-weight:750;line-height:1;grid-row:span 2}
.clock-l{font-size:15px;color:var(--ink-2);font-weight:600}
.clock-bar{position:relative;display:flex;height:10px;border-radius:5px;overflow:hidden}
.clock-bar span{display:block;height:100%}
.clock-bar .s-inf{background:var(--surface-3)} .clock-bar .s-esf{background:var(--warn-line)} .clock-bar .s-jan{background:var(--em-line)} .clock-bar .s-fora{background:var(--danger-soft)}
.clock-bar i{position:absolute;top:-2px;width:4px;height:14px;margin-left:-2px;border-radius:2px;background:var(--ink)}
.clock.esfriar{border-color:var(--warn-line)} .clock.janela{border-color:var(--em)} .clock.fora{border-color:var(--danger)}
.clock.janela .clock-l{color:var(--em-strong)} .clock.fora .clock-l{color:#f6c0b5}

/* ficha */
.posbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;top:64px;z-index:5;background:var(--bg);padding:8px 0}
.posbar div{text-align:center;font-weight:700;background:var(--surface-2);border-radius:10px;padding:8px}
.axis{border-top:1px solid var(--line);padding:10px 0}
.axis-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.axis-h b{font-size:17px}
.anchors{font-size:13px;color:var(--muted)}
.axis-pos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.ap{background:var(--surface-2);border-radius:12px;padding:8px 12px}
.ap .val{font-size:22px;font-weight:720;min-height:30px}
.ap-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ap-h .val{min-height:0;line-height:1.2}
.ap .val.mute{font-size:15px;color:var(--faint);font-weight:550}
.ap input[type=range].unset{opacity:.35}
.ap input[type=range]{width:100%;height:52px;accent-color:var(--em);background:transparent;border:0;padding:0;min-height:52px}
.ap .st{display:flex;gap:6px;margin-top:2px}
.ap .st button{flex:1;min-height:52px;font-size:13px;border-radius:9px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);cursor:pointer;font-family:inherit;padding:2px 6px}
.ap .st button[aria-pressed=true]{border-color:var(--em);background:var(--em-soft);color:var(--ink)}
.sig{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sig button{min-height:52px;border-radius:22px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);font:inherit;font-size:14px;padding:0 14px;cursor:pointer}
.sig button[aria-pressed=true]{border-color:var(--em);background:var(--em-soft);color:var(--ink)}
.sigitem{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.descs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.descs .chip{font-size:14px}
.prefs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.prefs button{min-height:76px;border-radius:14px;border:2px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:inherit;font-size:18px;font-weight:650;cursor:pointer}
.prefs button[aria-pressed=true]{border-color:var(--em);background:var(--em-soft)}

/* biblioteca */
.lex-fams{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.lex-fams button{min-height:52px;border-radius:22px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);font:inherit;font-size:14px;padding:0 14px;cursor:pointer}
.lex-fams button[aria-pressed=true]{border-color:var(--em);color:var(--ink);background:var(--em-soft)}
.lex-item{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.lex-item b{font-size:16px}
.lex-item .orig{color:var(--muted);font-style:italic;font-size:14px}
.lex-item .ctx{font-size:14px;color:var(--ink-2)}
.lex-item .ref{font-size:13px;color:var(--muted)}
.uso{display:inline-block;font-size:12px;border-radius:6px;padding:1px 6px;margin-right:4px;border:1px solid var(--line-2)}
.uso.cheirar{color:#f3d6aa;border-color:var(--warn-line)}

/* relatório */
.verdict{border-radius:var(--r);padding:var(--pad);margin:18px 0;background:var(--surface);border:1px solid var(--line)}
.verdict .lab{font-size:14px;color:var(--muted);font-weight:600}
.verdict .sint{font-size:clamp(20px,3.2vw,25px);font-weight:680;line-height:1.3;letter-spacing:-.01em;margin:6px 0 12px}
.verdict .dec{font-size:17px;border-left:3px solid var(--em);padding-left:12px;color:var(--ink)}
/* "Quanto posso confiar?": a categoria vem escrita; a cor só reforça */
.conf{border-left:3px solid var(--line-2);padding:2px 0 2px 12px;margin:6px 0 14px;font-size:15px;color:var(--ink-2)}
.conf b{display:block;font-size:17px;color:var(--ink);margin-bottom:2px}
.conf.sustentada{border-left-color:var(--em)} .conf.indicativa,.conf.limitada{border-left-color:var(--warn)} .conf.sem-conclusao,.conf.observacao{border-left-color:var(--danger)}
@media print{.conf{border-left-color:#111!important;color:#111}.conf b{color:#111}}
.quick{list-style:none;padding:0;margin:14px 0}
.quick li{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.quick li b{color:var(--muted);font-weight:600;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:600}
table.t td.num{text-align:right}
.tag{display:inline-block;font-size:13px;border-radius:6px;padding:1px 8px;border:1px solid var(--line-2);color:var(--ink-2);margin-right:4px}
.tag.A{border-color:var(--a);color:var(--a)} .tag.B{border-color:var(--b);color:var(--b)}
.tag.leg{border-color:var(--warn-line);color:#f3d6aa}
.hyp{background:var(--surface-2);border-radius:12px;padding:14px;margin:10px 0}
.hyp h4{margin:0 0 6px;font-size:16px}
.hyp ul{margin:6px 0 0;padding-left:18px;font-size:15px;color:var(--ink-2)}
.origin{font-size:12px;color:var(--muted)}
.rfield{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-bottom:8px}
.rfield select{min-height:var(--tap)}
.prof{margin:12px 0 16px}
.prof-row{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.prof-row .pn{font-size:14px;font-weight:600;color:var(--ink-2)}
.prof-row .pdl{font-size:14px;text-align:right;font-weight:650}
.prof-bars{display:flex;flex-direction:column;gap:3px}
.prof-bars div{height:10px;border-radius:5px;background:var(--surface-3);position:relative}
.prof-bars i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.prof-bars .A i{background:var(--a)} .prof-bars .B i{background:var(--b)}
.prof-leg{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px}
.prof-leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--a)}
.prof-leg span.B::before{background:var(--b)}
@media print{.prof-bars .A i{background:#888}.prof-bars .B i{background:#222}.prof-leg span::before{background:#888}.prof-leg span.B::before{background:#222}}
.hist-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.hist-item .meta{font-size:14px;color:var(--muted)}

/* modais */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,7,.78);display:flex;align-items:center;justify-content:center;padding:18px}
.modal .box{background:var(--surface);border:1px solid var(--line-2);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.modal .box h3{margin-top:0;font-size:21px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#0b100e;font-weight:650;border-radius:24px;padding:12px 20px;z-index:80;font-size:15px}

@media (max-width:620px){
  .grid2,.who,.actions-2{grid-template-columns:1fr}
  .axis-pos{grid-template-columns:1fr}
  .quick li{grid-template-columns:1fr;gap:2px}
  .prefs{grid-template-columns:1fr}
  .prefs button{min-height:56px}
  .stages li{font-size:12px}
  .posbar{top:58px}
  .sigitem{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  html,body{background:#fff;color:#111}
  #topbar,.no-print,.sess-actions,.btn,.toast,.modal{display:none!important}
  .card,.verdict,details.x,.hyp,.note{background:#fff;border-color:#bbb;color:#111}
  .muted,.tiny,.verdict .lab,.quick li b,table.t th,.origin{color:#444}
  .verdict .dec{border-color:#111}
  details.x > summary::before{content:""}
  .tag.A,.tag.B,.tag.leg{color:#111;border-color:#888}
  .demo-flag{background:#fff;color:#000;border:2px solid #000}
  a{color:#111}
}

<body>

<main class="wrap" id="app" tabindex="-1"></main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
/* ============================================================
   TRIÂNGULO OCR v2.0 — núcleo puro (sem DOM)
   estatística · plano de alocação · sessão · armazenamento · migração
   ============================================================ */
(function (root) {
  'use strict';
  const STORE_KEY = 'triangulo_ocr_v3';
  const LEGACY_ACTIVE = 'triangulo_ocr_v2';
  const LEGACY_ARCH = 'triangulo_ocr_archive_v1';
  const GRIND_KEY = 'triangulo_grind_v1';
  const P0 = 1 / 3;
  const AXES = [
    { k: 'acidez', name: 'Acidez' }, { k: 'docura', name: 'Doçura' }, { k: 'corpo', name: 'Corpo' },
    { k: 'finalizacao', name: 'Finalização' }, { k: 'complexidade', name: 'Complexidade' }, { k: 'limpeza', name: 'Limpeza' }
  ];
  /* as seis ordens de apresentação (posições 1·2·3) — ISO 4120:2021 §7.1 */
  const ORDERS = [['A', 'A', 'B'], ['A', 'B', 'A'], ['B', 'A', 'A'], ['A', 'B', 'B'], ['B', 'A', 'B'], ['B', 'B', 'A']];

  /* ---------- estatística ---------- */
  function lgamma(z) {
    const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lgamma(1 - z);
    z -= 1; let x = c[0]; const t = z + g + 0.5;
    for (let i = 1; i < g + 2; i++) x += c[i] / (z + i);
    return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
  }
  const lchoose = (N, k) => lgamma(N + 1) - lgamma(k + 1) - lgamma(N - k + 1);
  function binTail(n, k, p) {
    if (n < 1 || k <= 0) return 1;
    if (k > n) return 0;
    const lp = Math.log(p), lq = Math.log(1 - p); let t = 0;
    for (let j = k; j <= n; j++) t += Math.exp(lchoose(n, j) + j * lp + (n - j) * lq);
    return Math.min(1, t);
  }
  /** P(X ≥ k | n, p0 = 1/3) — cauda superior exata */
  function tailP(n, k) { return binTail(n, k, P0); }
  /** menor k com P(X ≥ k) ≤ α */
  function critical(n, alpha) {
    alpha = alpha || 0.05; if (n < 1) return null;
    for (let x = 0; x <= n; x++) if (tailP(n, x) <= alpha) return x;
    return n + 1;
  }
  /** poder: P(X ≥ crit | n, pc) para uma probabilidade de acerto assumida */
  function power(n, pc, alpha) {
    const k = critical(n, alpha || 0.05);
    if (k > n) return 0;
    return binTail(n, k, pc);
  }
  /**
   * Proporção de distinguidores (ISO 4120): pc = pd + (1 − pd)/3  ⇒  pd = (3·pc − 1)/2.
   * Limites unilaterais exatos (Clopper-Pearson) para pc, convertidos em pd e cortados em [0, 1].
   * upper: P(X ≤ x | pcU) = 1 − conf · lower: P(X ≥ x | pcL) = 1 − conf.
   */
  function pdBounds(n, x, conf) {
    if (!(n >= 1)) return null;
    const b = 1 - (conf || 0.95), toPd = pc => Math.max(0, Math.min(1, (3 * pc - 1) / 2));
    const solve = (f, lo, hi) => { for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (f(m)) hi = m; else lo = m; } return (lo + hi) / 2; };
    const pcU = x >= n ? 1 : solve(p => 1 - binTail(n, x + 1, p) <= b, x / n, 1 - 1e-12);   // menor p com P(X ≤ x) ≤ β
    const pcL = x <= 0 ? 0 : solve(p => binTail(n, x, p) >= b, 1e-12, x / n);                // menor p com P(X ≥ x) ≥ β
    return { pc: x / n, pd: toPd(x / n), pdUpper: toPd(pcU), pdLower: toPd(pcL), conf: conf || 0.95 };
  }
  /** faixas da ISO 4120 para pd: < 25 % pequena · 25–35 % média · > 35 % grande */
  function pdBand(pd) { return pd < 0.25 ? 'pequena' : pd <= 0.35 ? 'média' : 'grande'; }
  /**
   * Teste de SEMELHANÇA (ISO 4120): conclui semelhança se acertos ≤ kmax, com kmax = maior x tal que
   * P(X ≤ x | n, pcMax) ≤ β, pcMax = pdMax + (1 − pdMax)/3. kmax = −1 quando o n não permite concluir.
   * chanceIguais = P(X ≤ kmax | p₀ = 1/3): chance de concluir semelhança se as torras forem de fato iguais.
   */
  function simRule(n, pdMax, beta) {
    beta = beta || 0.05; const pcMax = pdMax + (1 - pdMax) / 3;
    let kmax = -1;
    for (let x = 0; x <= n; x++) { if (1 - binTail(n, x + 1, pcMax) <= beta) kmax = x; else break; }
    return { pdMax, beta, pcMax, kmax, chanceIguais: kmax < 0 ? 0 : 1 - binTail(n, kmax + 1, P0) };
  }
  /*
   * Planejamento de n. As duas medidas oscilam em dente de serra com n (binomial discreta): um n que cumpre o
   * critério pode ser seguido de outro que não cumpre. Por isso as buscas andam de "desde" em diante, de k em k
   * (k = avaliadores, para repetições iguais), e devolvem o primeiro n que DE FATO cumpre — nunca "n ≥ X".
   * Devolvem null se nada até NMAX cumprir.
   */
  const NMAX = 90;
  const passoDe = (desde, k) => { k = k || 1; return { k, n0: Math.ceil(Math.max(6, desde || 6) / k) * k }; };
  /** primeiro n (múltiplo de k, a partir de desde) com chance ≥ alvo de concluir semelhança quando as torras são iguais */
  function nForSim(pdMax, beta, alvo, k, desde) {
    const p = passoDe(desde, k);
    for (let n = p.n0; n <= NMAX; n += p.k) if (simRule(n, pdMax, beta).chanceIguais >= (alvo || 0.8)) return n;
    return null;
  }
  /** primeiro n (múltiplo de k, a partir de desde) em que acertos no nível do acaso (n/3) já dão pd < 25 % com 95 % */
  function nSmallPd(k, desde) {
    const p = passoDe(desde, k);
    for (let n = p.n0; n <= NMAX; n += p.k) if (pdBounds(n, Math.round(n / 3), 0.95).pdUpper < 0.25) return n;
    return null;
  }
  function nForSmallPd() { return nSmallPd(1, 6); }
  /** repetições iguais: no revezamento e com preparador dedicado, n múltiplo do número de avaliadores */
  function kAvaliadores(modo, avaliadores) { return modo !== 'solo' && avaliadores && avaliadores.length > 1 ? avaliadores.length : 1; }

  /* ---------- aleatoriedade ---------- */
  function cryptoRng() {
    try {
      const c = (typeof crypto !== 'undefined') && crypto.getRandomValues ? crypto : null;

    } catch (e) { /* */ }
    return Math.random;
  }
  function shuffle(a, rng) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function uid() { return 's' + Date.now().toString(36) + Math.floor(cryptoRng()() * 1e9).toString(36); }

  /* ---------- plano de alocação ---------- */
  /**
   * Sequência própria por provador, em blocos de seis sorteados (cada ordem uma vez por bloco).
   * O que alguém vê ao preparar pertence à sequência de OUTRO provador — não informa a sua.
   */
  function buildPlan(opt) {
    const rng = opt.rng || cryptoRng();
    const n = opt.n, mode = opt.mode || 'revezamento';
    const tasters = (opt.tasters && opt.tasters.length) ? opt.tasters.slice() : ['Você'];
    const seq = {}, used = {};
    tasters.forEach(t => { seq[t] = []; used[t] = 0; });
    const nextOrder = t => {
      if (used[t] >= seq[t].length) seq[t] = seq[t].concat(shuffle([0, 1, 2, 3, 4, 5], rng));
      return seq[t][used[t]++];
    };
    const k = tasters.length, plan = [];
    for (let r = 0; r < n; r++) {
      const taster = tasters[r % k];
      let preparer;
      if (mode === 'solo') preparer = taster;
      else if (mode === 'dedicado') preparer = opt.preparer || 'Preparador';
      else preparer = k > 1 ? tasters[(r + 1) % k] : '—';
      plan.push({ i: r, taster, preparer, order: nextOrder(taster) });
    }
    return plan;
  }
  /** reposição de uma rodada invalidada: mesmo provador, ordem sorteada diferente da invalidada */
  function appendReplacement(plan, round, rng) {
    rng = rng || cryptoRng();
    const pool = [0, 1, 2, 3, 4, 5].filter(o => o !== round.order);
    const order = pool[Math.floor(rng() * pool.length)];
    return plan.concat([{ i: plan.length, taster: round.taster, preparer: round.preparer, order, replaces: round.i }]);
  }
  function oddOf(order) { const a = ORDERS[order]; const odd = a.filter(x => x === 'A').length === 1 ? 'A' : 'B'; return { letter: odd, pos: a.indexOf(odd) }; }

  /* ---------- leitura do triângulo ---------- */
  function triStats(s) {
    const tri = s.tri || {};
    const rounds = (tri.rodadas || []);
    const valid = rounds.filter(r => r.status !== 'invalidada');
    const hits = valid.filter(r => r.acerto).length;
    const repsPer = {};
    valid.forEach(r => { const t = r.taster || '—'; repsPer[t] = (repsPer[t] || 0) + 1; });
    const distinct = Object.keys(repsPer).length;
    const n = valid.length, nPlan = tri.nPlanejado || n;
    const complete = !tri.interrompida && n >= nPlan && n > 0;
    const alpha = tri.alpha || 0.05;
    const crit = critical(Math.max(n, 1), alpha);
    const exploratory = [];
    if (s.modo === 'solo') exploratory.push('modo solo');
    if ((tri.desvios || []).length) exploratory.push('desvio registrado');
    if (rounds.some(r => r.status === 'invalidada')) exploratory.push('rodadas invalidadas');
    const reps = Object.values(repsPer);
    if (reps.length > 1 && Math.max(...reps) !== Math.min(...reps)) exploratory.push('repetições desiguais');
    if (distinct === 1) exploratory.push('um só avaliador');
    const p = complete ? tailP(n, hits) : null;
    const sig = complete ? hits >= crit : null;
    /* desenho de semelhança: regra própria, travada no início; sessões antigas não têm o campo = diferença */
    const desenho = tri.desenho === 'semelhanca' ? 'semelhanca' : 'diferenca';
    let sim = null;
    if (desenho === 'semelhanca') {
      sim = simRule(Math.max(n, 1), tri.pdMax || 0.3, tri.beta || 0.05);
      sim.similar = complete ? hits <= sim.kmax : null;
      sim.pSim = complete ? 1 - binTail(n, hits + 1, sim.pcMax) : null;   // P(X ≤ acertos | pcMax)
    }
    return { valid: n, hits, errors: n - hits, n, nPlanejado: nPlan, crit, alpha, p, sig, complete, desenho, sim,
      distinctTasters: distinct, repsPer, exploratory, invalidated: rounds.length - valid.length };
  }

  /* ---------- sessão ---------- */
  function emptyField() { return { v: '', o: '' }; }
  function emptyRoast() { return { alog: '', gas: emptyField(), ar: emptyField(), fc: emptyField(), drop: emptyField(), dev: emptyField(), dtr: emptyField(), ror: emptyField(), perda: emptyField(), cor: emptyField(), obs: '' }; }
  function newSession(f) {
    f = f || {};
    const now = Date.now();
    return {
      schema: 3, id: uid(), criadaEm: now, atualizadaEm: now, origem: 'v3', demo: !!f.demo,
      status: 'config',
      modulos: { tri: f.tri !== false, desc: f.desc !== false },
      par: { A: { ocr: f.A || '', papel: 'controle' }, B: { ocr: f.B || '', papel: 'variante' },
        objetivo: f.objetivo || '', pergunta: f.pergunta || '', mudancas: f.mudancas || [] },
      lote: f.lote || '',
      preparo: Object.assign({ metodo: 'Cupping SCA (imersão)', moedor: 'Mahlkönig EK43', moagem: '7,5', dose: '8,25 g', agua: '150 ml',
        temp: '93 °C', infusao: '4 min', idadeA: '', idadeB: '', destoou: false, obs: '' }, f.preparo || {}),
      torra: { A: emptyRoast(), B: emptyRoast() },
      avaliadores: f.avaliadores || [], modo: f.modo || 'revezamento', preparador: f.preparador || '',
      tri: { nPlanejado: f.n || 12, alpha: 0.05, desenho: f.desenho === 'semelhanca' ? 'semelhanca' : 'diferenca', pdMax: f.pdMax || 0.3, beta: 0.05,
        regra: f.desenho === 'semelhanca' ? 'semelhança: binomial exata, cauda inferior, pd máx. ' + Math.round((f.pdMax || 0.3) * 100) + ' %, β 0,05' : 'binomial exata, cauda superior, p₀ = 1/3', travadoEm: null,
        plano: [], rodadas: [], desvios: [], etapa: null, interrompida: false, revelado: false, reveladoEm: null },
      desc: { alocacao: null, fichas: [], revelada: false },
      investigacao: { grao: { A: '', B: '' }, curva: { A: '', B: '' }, notas: '' },
      anotacoesLegadas: [], proximo: null, decisao: null
    };
  }

  /* ---------- migração do formato v1 (chaves triangulo_ocr_v2 / archive_v1) ---------- */
  const LEGACY_AXIS = { acidez: 'acidez', docura: 'docura', corpo: 'corpo', aftertaste: 'finalizacao', complexidade: 'complexidade', limpeza: 'limpeza' };
  function parseJSON(raw) { if (raw == null) return null; try { return JSON.parse(raw); } catch (e) { return null; } }
  function legacyToSession(old, origem) {
    if (!old || typeof old !== 'object' || !Array.isArray(old.evals)) return null;
    const evals = old.evals.filter(e => e && typeof e === 'object');
    if (!evals.length) return null;
    old = Object.assign({}, old, { evals });
    const solo = old.mode === 'solo';
    const s = newSession({ A: String(old.ocrA || ''), B: String(old.ocrB || ''), objetivo: '', pergunta: String(old.varTested || ''),
      modo: solo ? 'solo' : 'revezamento', avaliadores: solo ? [old.nameA || 'Você'] : [old.nameA || 'Avaliador 1', old.nameB || 'Avaliador 2'],
      n: old.targetN || old.evals.length || 6 });
    s.origem = origem;
    s.legadoChave = legacyKey(old);
    s.id = 'leg_' + (old.seriesId || ((old.evals[0] && old.evals[0].t) || '') ) + '_' + origem.slice(-6);
    s.criadaEm = (old.evals[0] && old.evals[0].t) || old.archivedAt || Date.now();
    s.atualizadaEm = old.archivedAt || s.criadaEm;
    s.par.objetivo = '';
    s.notaLegado = 'Migrado da v1 (triangulo_ocr_v2/archive_v1). Sem plano por provador, sem registro de ordens nem desvios; n e regra não estavam travados no formato antigo.';
    s.tri.rodadas = old.evals.map((e, i) => ({ planoIdx: i, taster: e.taster || null, preparer: e.shuffler || null, order: null,
      impar: typeof e.oddPos === 'number' ? e.oddPos : null, escolha: typeof e.pick === 'number' ? e.pick : null,
      acerto: !!e.hit, status: 'valida', t: e.t || null, legado: true }));
    s.tri.nPlanejado = old.targetN || old.evals.length;
    s.tri.travadoEm = s.criadaEm;
    s.tri.revelado = !!old.revealed || origem === 'legado-v2-caderno';
    s.status = s.tri.revelado ? 'revelada' : 'legado-aberta';
    (old.descr || []).forEach(d => {
      if (!d || !d.scores) return;
      const posA = typeof d.posA === 'number' ? d.posA : 0;
      const aloc = posA === 0 ? ['A', 'B'] : ['B', 'A'];
      if (!s.desc.alocacao) s.desc.alocacao = aloc;
      const eixos = { 0: {}, 1: {} };
      [0, 1].forEach(p => {
        const sc = d.scores[p] || {};
        AXES.forEach(ax => { eixos[p][ax.k] = { estado: 'nao_avaliado', v: null }; });
        Object.keys(sc).forEach(k => { const nk = LEGACY_AXIS[k]; if (nk && typeof sc[k] === 'number') eixos[p][nk] = { estado: 'valor', v: sc[k] }; });
      });
      s.desc.fichas.push({ avaliador: '(não registrado na v1)', livre: { 0: '', 1: '' }, eixos, descritores: [], esfriar: { 0: '', 1: '' },
        sinais: { 0: { estado: 'nao_avaliado', itens: [] }, 1: { estado: 'nao_avaliado', itens: [] } },
        preferencia: { escolha: null, justificativa: '' }, notas: d.notes || '', travada: true, travadaEm: d.t || null, alocacao: aloc, legado: true });
      if (Array.isArray(d.defects) && d.defects.length)
        s.anotacoesLegadas.push({ origem: 'marcação de defeito da v1', defeitos: { A: [], B: [], semPosicao: d.defects.map(String) },
          nota: 'Anotação legada — não é confirmação; a v1 não registrou a amostra desta marcação.' });
      else if (d.defects && typeof d.defects === 'object' && ((d.defects.A || []).length || (d.defects.B || []).length))
        s.anotacoesLegadas.push({ origem: 'marcação de defeito da v1', defeitos: { A: [].concat(d.defects.A || []), B: [].concat(d.defects.B || []) },
          nota: 'Anotação legada — não é confirmação; tratada como pista a investigar.' });
    });
    s.desc.revelada = s.desc.fichas.length > 0;
    s.modulos.desc = s.desc.fichas.length > 0;
    return s;
  }
  function migrateLegacy(rawActive, rawArch) {
    const out = [];
    const arch = parseJSON(rawArch);
    const byKey = new Map();
    if (Array.isArray(arch)) arch.forEach(o => {
      try { const s = legacyToSession(o, 'legado-v2-caderno'); if (s) { out.push(s); byKey.set(s.legadoChave, s); } } catch (e) { /* item ruim fica de fora */ }
    });
    const act = parseJSON(rawActive);
    if (act && typeof act === 'object' && !Array.isArray(act)) {
      try {
        const s = legacyToSession(act, 'legado-v2-ativa');
        const twin = s && byKey.get(s.legadoChave);
        if (s && !(twin && twin.tri.rodadas.length >= s.tri.rodadas.length)) out.push(s);
      } catch (e) { /* */ }
    }
    return out;
  }
  function firstT(o) { const e = o && Array.isArray(o.evals) && o.evals.find(x => x && typeof x === 'object'); return (e && e.t) || null; }
  function legacyKey(o) { return String(o.seriesId || firstT(o) || ((o.ocrA || '') + '|' + (o.ocrB || '') + '|' + (o.archivedAt || ''))); }
  function sameLegacy(a, b) {
    if (a.legadoChave && b.legadoChave) return a.legadoChave === b.legadoChave;
    return /^legado/.test(a.origem || '') && a.criadaEm === b.criadaEm && a.par.A.ocr === b.par.A.ocr && a.par.B.ocr === b.par.B.ocr;

  function fileStamp() { const d = new Date(), p = x => String(x).padStart(2, '0'); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()); }
  const slug = x => String(x || '').replace(/[^\w-]+/g, '_').slice(0, 40);
  function download(name, text, mime) {
    try { const blob = new Blob([text], { type: mime + ';charset=utf-8' }); const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 200); return true; } catch (e) { return false; }

  function analysis(s) { return { decisao: AN.decide(s), confianca: AN.confianca(s), perfil: AN.profile(s), preferencia: AN.prefTally(s), hipoteses: AN.hypotheses(s), sinais: AN.signals(s) }; }
  function resumoText(s) {
    const a = analysis(s), D = a.decisao, st = D.stats, P = a.perfil, A = s.par.A.ocr, B = s.par.B.ocr, prox = s.proximo || D.proximo;
    const L = [];
    L.push('ROAST_HISTORY · Triângulo OCR ' + VERSAO + ' · sessão ' + s.id + ' · ' + fmtDT(s.criadaEm) + (s.demo ? ' · DEMONSTRAÇÃO (dados fictícios)' : ''));
    L.push('Par: ' + A + ' (controle) × ' + B + ' (variante) · lote: ' + (s.lote || 'não informado'));
    L.push('Objetivo: ' + (s.par.objetivo || '—') + ' · mudanças: ' + ((s.par.mudancas || []).join(', ') || 'não informado'));
    L.push('Preparo: ' + [s.preparo.metodo, 'moagem ' + s.preparo.moagem + ' (' + s.preparo.moedor + ')', s.preparo.dose + '/' + s.preparo.agua, s.preparo.temp, s.preparo.infusao].join(' · ') + (s.preparo.destoou ? ' · PREPARO DESTOOU' : ''));
    if (st) L.push('Triângulo (cego, ISO 4120' + (st.sim ? ', pergunta de SEMELHANÇA' : '') + '): ' + simPrefixo(st) + st.hits + '/' + st.valid + ' válidas · limiar ' + st.crit + ' · α 0,05 · p = ' + AN.fmtP(st.p) + ' · ' + st.distinctTasters + ' avaliador(es) ' + JSON.stringify(st.repsPer) + (st.exploratory.length ? ' · exploratório: ' + st.exploratory.join(', ') : '') + (st.complete ? '' : ' · INCOMPLETA') + (pdInfo(st) ? ' · pd: ' + pdInfo(st).curto : ''));
    L.push('Síntese: ' + D.sintese);
    L.push('Confiança: ' + a.confianca.titulo + ' — ' + a.confianca.porque);
    const fichas = s.desc.fichas.filter(f => f.travada && !f.ladoPendente);
    if (fichas.length) L.push('Descritiva (' + fichasTxt(fichas) + ', escala OCR 1–10 de intensidade): Δ B−A ' + C.AXES.map(x => x.name.toLowerCase() + ' ' + fmtSigned(P.delta[x.k])).join(' · '));
    L.push('Preferência para o objetivo: ' + B + ' ' + a.preferencia.B + ' · ' + A + ' ' + a.preferencia.A + ' · sem preferência ' + a.preferencia.nenhuma + ' · sem resposta ' + a.preferencia.semResposta);
    a.hipoteses.forEach(h => L.push('Hipótese (não confirmada) em ' + h.amostra + ': ' + h.titulo + ' — ' + h.observado + ' Próximo dado: ' + h.proximo));
    s.anotacoesLegadas.forEach(x => L.push('Anotação legada v1 (não é confirmação): ' + legTxt(x)));
    L.push('Decisão: ' + D.decisao);
    L.push('Próxima prova: controle ' + prox.controle + (prox.variante ? ' · variante ' + prox.variante : '') + ' · mudança: ' + (prox.mudanca || 'a definir') + ' · manter: ' + (prox.manterTxt != null ? prox.manterTxt.replace(/\n/g, '; ') : prox.manter.join('; ')) + ' · critério: ' + prox.criterio + ' · plano: ' + prox.prova);
    L.push('Evidência: prova cega com placar oculto até o fim; preferência registrada separada da descrição (CVA SCA: descritiva × afetiva).');
    return L.join('\n');
  }
  function csvText(s) {
    const rows = [['secao', 'rodada', 'provador', 'preparador', 'ordem', 'posicao_diferente', 'posicao_marcada', 'acerto', 'status', 'motivo', 'quando', 'min_apos_agua', 'fora_da_janela']];
    s.tri.rodadas.forEach((r, i) => rows.push(['triangulo', i + 1, r.taster, r.preparer, r.order != null ? C.ORDERS[r.order].join('') : '', r.impar != null ? r.impar + 1 : '', r.escolha != null ? r.escolha + 1 : '', r.acerto ? 1 : 0, r.status, r.motivo || '', r.t ? new Date(r.t).toISOString() : '',
      r.minAgua != null ? String(r.minAgua) : '', r.minAgua != null ? (r.foraJanela ? 'sim' : 'nao') : '']));
    const st = s.modulos.tri ? C.triStats(s) : null;
    if (st) { rows.push([]); rows.push(['estatistica', 'validas', st.valid, 'acertos', st.hits, 'limiar', st.crit, 'p', st.p == null ? '' : st.p.toFixed(4), 'completa', st.complete ? 'sim' : 'nao', 'desenho', st.desenho,
      'pd_max', st.sim ? st.sim.pdMax : '', 'max_acertos_semelhanca', st.sim ? st.sim.kmax : '', 'p_semelhanca', st.sim && st.sim.pSim != null ? st.sim.pSim.toFixed(4) : '', 'semelhante', st.sim && st.complete ? (st.sim.similar ? 'sim' : 'nao') : '', 'confianca', AN.confianca(s).nivel]); }
    rows.push([]); rows.push(['ficha', 'avaliador', 'amostra', 'ocr', 'eixo', 'estado', 'valor', 'preferencia', 'min_inicio', 'min_trava']);
    s.desc.fichas.filter(f => f.travada).forEach((f, i) => [0, 1].forEach(p => C.AXES.forEach(ax => { const L = f.alocacao[p]; const e = f.eixos[p][ax.k];
      rows.push(['ficha', f.avaliador, L, s.par[L].ocr, ax.name, e.estado, e.v == null ? '' : e.v, f.preferencia.escolha == null ? 'sem resposta' : f.preferencia.escolha === 'nenhuma' ? 'nenhuma' : f.alocacao[Number(f.preferencia.escolha)],
        f.minInicio != null ? String(f.minInicio) : '', f.minFim != null ? String(f.minFim) : '']); })));
    if (s.demo) rows.unshift(['DEMONSTRAÇÃO — dados fictícios']);
    return '﻿' + rows.map(r => r.map(c => { c = String(c == null ? '' : c); return /[",;\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\n');
  }
  function mdText(s) {

      'objetivo: "' + String(s.par.objetivo || '').replace(/"/g, "'") + '"', st ? 'desenho: ' + st.desenho + '\nacertos: ' + st.hits + '\nvalidas: ' + st.valid + '\nlimiar: ' + st.crit + '\np: ' + (st.p == null ? 'null' : st.p.toFixed(4)) +
        (st.sim ? '\npd_max: ' + st.sim.pdMax + '\nmax_acertos_semelhanca: ' + st.sim.kmax + '\nsemelhante: ' + (st.complete ? (st.sim.similar ? 'sim' : 'nao') : 'null') : '') : 'triangulo: nao', s.demo ? 'demonstracao: true' : 'demonstracao: false', '---', '',
      '# ' + s.par.A.ocr + ' × ' + s.par.B.ocr, '', '**Síntese:** ' + D.sintese, '', '**Confiança:** ' + CF.titulo + ' — ' + CF.porque, '', '**Decisão:** ' + D.decisao, '', '```', resumoText(s), '```'].join('\n');

  function cadernoCsv() {
    const rows = [['data', 'origem', 'demonstracao', 'A', 'B', 'objetivo', 'status', 'validas', 'acertos', 'limiar', 'p', 'resultado', 'fichas']];
    ST.sessoes.forEach(s => {
      const rev = s.modulos.tri && (s.tri.revelado || s.status === 'interrompida');
      const st = rev ? C.triStats(s) : null;
      rows.push([fmtDate(s.criadaEm), s.origem, s.demo ? 'sim' : 'nao', s.par.A.ocr, s.par.B.ocr, s.par.objetivo || s.par.pergunta || '', s.status,
        st ? st.valid : '', st ? st.hits : '', st ? st.crit : '', st && st.p != null ? st.p.toFixed(4) : '', !s.modulos.tri ? 'só descritiva' : !rev ? 'oculto (em andamento)' : st.complete ? resultadoCurto(st) : 'incompleta',
        s.desc.revelada ? s.desc.fichas.filter(f => f.travada).length : '']);
    });
    return '﻿' + rows.map(r => r.map(c => { c = String(c == null ? '' : c); return /[",;\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\n');
  }
  /* ================= BACKUP · restaurar ================= */
  /* Aceita o backup completo ({schema, sessoes}) ou o JSON de uma sessão ({meta, sessao}). Só acrescenta; nunca apaga. */
  function lerBackup(txt) {
    const o = C.parseJSON(txt);
    if (!o || typeof o !== 'object') return { err: 'O arquivo não é um JSON válido.' };
    let sess;
    if (Array.isArray(o.sessoes)) {
      if (typeof o.schema === 'number' && o.schema > 3) return { err: 'Este backup foi gravado por uma versão mais nova do Triângulo OCR; não dá para restaurar aqui.' };
      sess = o.sessoes;
    } else if (o.sessao && typeof o.sessao === 'object') sess = [o.sessao];

      case 'rm-desc': { const f = curFicha(s); f.descritores.splice(Number(el.dataset.i), 1); touch(s); save(true); return refreshFicha(); }
      case 'sinal-outro': { const p = el.dataset.pos; const inp = $('[data-sinaloutro="' + p + '"]'); const v = inp.value.trim(); if (!v) return; const f = curFicha(s); f.sinais[p].itens.push({ sinal: v, fase: '', intensidade: '', livre: true }); f.sinais[p].estado = 'registrado'; touch(s); save(true); return refreshFicha(); }
      case 'travar-ficha': return travarFicha();
      case 'travar-sem-pref': return travarSemPref();
      case 'outra-ficha': { const v = $('#fOutroAval').value.trim(); if (!v) { $('#fOutroAval').focus(); return; } if (!s.avaliadores.includes(v)) s.avaliadores.push(v);
        /* sem registro de quem montou (sessão antiga), modo sozinho (xícaras já viradas) ou quem viu o mapa: novas posições */
        const viu = s.modo === 'solo' || !s.desc.alocacao || !Array.isArray(s.desc.mapaVistoPor) || s.desc.mapaVistoPor.includes(v);
        if (viu) { s.desc.etapa = { fase: 'prep', fichaIdx: null, avaliador: v, novoSorteio: true }; if (s.status !== 'revelada' && s.status !== 'interrompida') s.status = 'descritiva'; touch(s); UI.view = 'desc'; return vDesc(s); }
        const nf = blankFicha(v, s.desc.alocacao.slice()); nf.cega = true; nf.montadaPor = (s.desc.mapaVistoPor || []).join(', ') || null;
        s.desc.fichas.push(nf); s.desc.etapa = { fase: 'entrega', fichaIdx: s.desc.fichas.length - 1 }; if (s.status !== 'revelada' && s.status !== 'interrompida') s.status = 'descritiva'; touch(s); UI.view = 'desc'; return vDesc(s); }
      case 'add-ficha-rel': { s.desc.etapa = { fase: 'travada', fichaIdx: null }; UI.view = 'desc'; if (!s.desc.alocacao) { s.desc.etapa = { fase: 'prep', fichaIdx: null }; } return vDesc(s); }
      case 'revelar': return openModal('<h3 id="mTitle">Revelar os resultados?</h3><p class="small">Depois disso as respostas e fichas desta sessão não mudam mais' +
        (s.desc.fichas.some(f => !f.travada) ? ', e a ficha em andamento é descartada' : '') + '. Confira se todos terminaram.</p>' +
        '<div class="actions-2"><button class="btn ghost" id="revelarCancel" type="button" data-act="fechar">Ainda não</button><button class="btn primary" id="revelarOk" type="button" data-act="revelar-ok">Revelar</button></div>', '#revelarCancel');
      case 'revelar-ok': closeModal(); return revelar();
      case 'ver-relatorio': return go('relatorio');
      case 'proximo-ab': { const p = s.proximo || AN.decide(s).proximo;
        /* adotar B só por escolha explícita (botão "Adotar B…"), nunca como efeito do resultado */
        const adotar = el.dataset.controle === 'B', ctrl = adotar ? s.par.B.ocr : (p.controle || s.par.A.ocr);
        if (adotar) { s.adocao = { controle: s.par.B.ocr, em: Date.now() }; touch(s); save(); }
        UI.draft = newDraft({ A: ctrl, B: p.variante || '', objetivo: s.par.objetivo, lote: s.lote, avaliadores: s.avaliadores.slice(), modo: s.modo, preparador: s.preparador,
          mod: s.modulos.tri && s.modulos.desc ? 'tri+desc' : s.modulos.tri ? 'tri' : 'desc', n: p.n || s.tri.nPlanejado,
          desenho: s.tri.desenho || 'diferenca', pdMax: s.tri.pdMax || 0.3, mudancas: p.mudanca && !/^repetir/.test(p.mudanca) ? p.mudanca : '',
          preparo: JSON.parse(JSON.stringify(s.preparo)), origemProximo: s.id });
        UI.draft.preparo.destoou = false; UI.draft.torra.A = JSON.parse(JSON.stringify(ctrl === s.par.B.ocr ? s.torra.B : s.torra.A));
        return go('setup'); }
      case 'imprimir': $$('details.x').forEach(d => { d.dataset.wasOpen = d.open ? '1' : ''; d.open = true; }); window.print(); return;
      case 'exp-resumo': return copyText(resumoText(s), 'Resumo copiado');
      case 'exp-csv': download('triangulo_' + slug(s.par.A.ocr) + '_vs_' + slug(s.par.B.ocr) + '_' + fileStamp() + '.csv', csvText(s), 'text/csv'); return toast('Download do CSV iniciado');
      case 'exp-json': download('triangulo_' + slug(s.par.A.ocr) + '_vs_' + slug(s.par.B.ocr) + '_' + fileStamp() + '.json', JSON.stringify({ meta: { app: 'Triângulo OCR', versao: VERSAO, exportadoEm: new Date().toISOString(), demonstracao: !!s.demo }, sessao: s, analise: analysis(s) }, null, 2), 'application/json'); return toast('Download do JSON iniciado');
      case 'exp-md': download('triangulo_' + slug(s.par.A.ocr) + '_vs_' + slug(s.par.B.ocr) + '_' + fileStamp() + '.md', mdText(s), 'text/markdown'); return toast('Download da nota iniciado');
      case 'exp-caderno': download('historico_triangulo_ocr_' + fileStamp() + '.csv', cadernoCsv(), 'text/csv'); return toast('Download do histórico iniciado');
      case 'baixar-bruto': download('triangulo_ocr_dados_' + fileStamp() + '.json', UI.raw || '', 'application/json'); return;
      case 'exportar-tudo': download('triangulo_ocr_backup_' + fileStamp() + '.json', JSON.stringify(ST, null, 2), 'application/json'); return toast('Download do backup iniciado');
      case 'restaurar': if (!READONLY) $('#fileRestaurar').click(); return;
      case 'restaurar-ok': return aplicarRestauro();
      case 'demo': { let d = ST.sessoes.find(x => x.demo); if (!d) { d = makeDemo(); ST.sessoes.push(d); } UI.cur = d.id; return go('relatorio'); }
      case 'abrir': { const x = ST.sessoes.find(y => y.id === el.dataset.id); if (!x) return; UI.cur = x.id; if (OPEN.includes(x.status)) return resume(x.id); return go('relatorio'); }
      case 'legado-encerrar': s.tri.interrompida = true; s.status = 'interrompida'; s.tri.revelado = true; touch(s); return go('relatorio');
    }
  });
  window.addEventListener('afterprint', () => { $$('details.x').forEach(d => { if (d.dataset.wasOpen != null) d.open = d.dataset.wasOpen === '1'; }); });

  /* ---------------- retomar (tela neutra quando o tablet pode estar com quem prova) ---------------- */
  function resume(id) {
    const s = ST.sessoes.find(x => x.id === id); if (!s) return go('home');
    UI.cur = s.id;
    if (s.status === 'legado-aberta') return go('legado');
    if (s.status === 'triangulo') {
      const e = s.tri.etapa || (s.tri.etapa = { planoIdx: nextPlanIdx(s), fase: 'rodada' });
      if (e.fase === 'mapa') e.fase = 'rodada';
      if (e.fase === 'prova') e.fase = s.modo === 'solo' ? 'rodada' : 'entrega';
      if (e.fase === 'registrada') { const nx = nextPlanIdx(s); s.tri.etapa = { planoIdx: nx, fase: nx == null ? 'fim' : 'rodada' }; }
      return go('tri');
    }
    if (s.status === 'descritiva') {
      const e = s.desc.etapa || (s.desc.etapa = { fase: 'prep', fichaIdx: null });
      if (e.fase === 'mapa') { const f = curFicha(s); if (f && !f.travada) s.desc.fichas.splice(e.fichaIdx, 1); s.desc.etapa = { fase: 'prep', fichaIdx: null }; }
      return go('desc');
    }
    return go('relatorio');
  }

  /* ---------------- ajuda ---------------- */
  $('#helpBtn').addEventListener('click', () => openModal('<h3 id="mTitle">Por que este método</h3>' +
    '<p><b>O triângulo responde uma pergunta:</b> conseguimos distinguir as duas torras? Três xícaras, duas iguais; acertar por sorte acontece uma vez em três. O app compara os acertos com a cauda exata da binomial (α = 0,05).</p>' +
    '<p><b>Por que o resultado fica oculto:</b> saber se acertou muda a forma de provar as próximas rodadas. Esconder reduz essa influência — mas não elimina memória, fadiga, ordem e resíduo na boca.</p>' +
    '<p><b>Repetições:</b> a mesma pessoa pode repetir rodadas no teste de diferença (ISO 4120:2021). A conclusão fala desses avaliadores; um painel tem 24 a 30 pessoas.</p>' +
    '<p><b>Abaixo do limiar:</b> "diferença não detectada nas condições desta prova". Não prova que são iguais. Pode ser que a mudança não chegue à xícara, que seja sutil para este n ou que o preparo tenha embaçado o sinal.</p>' +
    '<p><b>Diferença ou semelhança:</b> escolha antes de começar. Diferença responde "a mudança chega à xícara?" (para mudanças que deveriam melhorar). Semelhança responde "dá para mudar sem alterar a xícara?" (torra mais curta, menos gás, outro lote): conclui se os acertos ficarem abaixo de um máximo travado, com β = 0,05. Ela pede mais rodadas — a tela de configuração mostra o n exato para a margem e o número de avaliadores. Semelhança demonstrada não escolhe por você: adotar B é um botão à parte no relatório.</p>' +
    '<p><b>Ficha e escolha:</b> a ficha descreve (intensidade, escala OCR própria); a escolha julga pelo objetivo. São separadas, como o Coffee Value Assessment da SCA separa a avaliação descritiva da afetiva. Esta não é a ficha oficial da SCA.</p>' +
    '<p><b>Defeitos:</b> o app registra sinais observáveis e só depois sugere hipóteses, com alternativas e o próximo dado a medir. Nada vira diagnóstico automático.</p>' +
    '<div class="actions"><button class="btn primary" type="button" data-act="fechar">Entendi</button></div>'));

  function banner(id, text, raw) {
    const d = document.createElement('div'); d.id = id; d.className = 'note ' + (raw != null ? 'danger' : 'warn') + ' wrap'; d.setAttribute('role', 'alert');
    d.innerHTML = '<b>' + esc(text) + '</b>' + (raw != null ? ' <button class="btn ghost" type="button" data-act="baixar-bruto">Baixar os dados como estão</button>' : '');
    document.body.insertBefore(d, $('#app'));
    if (raw != null) UI.raw = raw;
  }

  /* ---------------- boot ---------------- */
  function boot() {
    const r = C.loadStore(); ST = r.store;
    if (r.error) showSaveError(r.error);
    if (r.readOnly) { READONLY = true; banner('roBanner', r.warning, r.raw); }
    else if (r.warning) banner('warnBanner', r.warning, null);
    if (r.imported) setTimeout(() => toast(r.imported + ' sessão(ões) trazida(s) da versão anterior'), 300);
    let ptr = null; try { ptr = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); } catch (e) { /* */ }
    const s = ptr && ST.sessoes.find(x => x.id === ptr.cur);
    if (s && (s.status === 'triangulo' || s.status === 'descritiva')) return resume(s.id);
    if (s && ptr.view === 'relatorio') { UI.cur = s.id; return go('relatorio'); }
    go('home');
  }
  boot();
})();

/* PWA — marca, manifesto e instalação (preservado da v1, com a marca v2) */
(function () {
  'use strict';
  const BG = '#0f1412', EM = '#34c38f', CREAM = '#e9dcc6', COPPER = '#d68a5c';
  const $ = s => document.querySelector(s);
  function mark(tile) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">' + (tile ? '<rect width="512" height="512" rx="116" fill="' + BG + '"/>' : '') +
      '<path d="M256 108 L408 380 L104 380 Z" fill="none" stroke="' + EM + '" stroke-width="30" stroke-linejoin="round"/>' +
      '<circle cx="256" cy="200" r="34" fill="' + CREAM + '"/><circle cx="196" cy="318" r="34" fill="' + CREAM + '"/><circle cx="316" cy="318" r="34" fill="' + COPPER + '"/></svg>';
  }
  const bm = $('#brandMark'); if (bm) bm.innerHTML = mark(false);
  function svgToPng(svg, size) {
    return new Promise(res => { const img = new Image();
      img.onload = () => { try { const cv = document.createElement('canvas'); cv.width = cv.height = size; cv.getContext('2d').drawImage(img, 0, 0, size, size); res(cv.toDataURL('image/png')); } catch (e) { res(null); } };
      img.onerror = () => res(null); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
  }
  (async function () {
    try {
      const svg = mark(true);
      const [p32, p180, p192, p512] = await Promise.all([svgToPng(svg, 32), svgToPng(svg, 180), svgToPng(svg, 192), svgToPng(svg, 512)]);
      if (p32) $('#favicon').href = p32;
      if (p180) $('#appleIcon').href = p180;
      if (p192 && p512 && location.protocol !== 'file:') {
        const manifest = { name: 'Triângulo OCR · Original Coffee Roaster', short_name: 'Triângulo OCR', description: 'Da mesa à decisão de torra: triângulo cego, ficha descritiva e escolha pelo objetivo.',
          start_url: '.', scope: '.', display: 'standalone', background_color: BG, theme_color: BG, lang: 'pt-BR',
          icons: [{ src: p192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: p512, sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: p512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
        $('#manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
      }
    } catch (e) { /* */ }
  })();
  const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const btn = $('#installBtn'); let deferred = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.classList.remove('hide'); });
  window.addEventListener('appinstalled', () => { btn.classList.add('hide'); deferred = null; });
  if (!standalone && isiOS && location.protocol !== 'file:') btn.classList.remove('hide');
  btn.addEventListener('click', () => {
    if (deferred) { deferred.prompt(); deferred.userChoice.finally(() => { deferred = null; btn.classList.add('hide'); }); return; }
    document.getElementById('modalRoot').innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="box"><h3 id="mTitle">Instalar na tela de início</h3>' +
      '<p>1. Toque em Compartilhar. 2. Escolha Adicionar à Tela de Início. 3. Confirme.</p><div class="actions"><button class="btn primary" type="button" data-act="fechar">Entendi</button></div></div></div>';
  });
})();

</script>
</body>
